name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests examples

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=trainspotter --cov-report=term-missing

      - name: Build
        run: uv build

  minimums:
    name: Oldest supported Python and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"

      # `requires-python` and every ">=" in pyproject.toml are promises. The lockfile tests
      # the newest versions; this installs the oldest ones the package says it accepts.
      - name: Install the oldest allowed version of each direct dependency
        run: |
          uv venv .venv-minimums
          uv pip install --python .venv-minimums --resolution lowest-direct -e ".[dev]"

      - name: Test
        run: .venv-minimums/bin/pytest -q
