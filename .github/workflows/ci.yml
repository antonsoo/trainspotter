name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests examples scripts

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=trainspotter --cov-report=term-missing

      - name: Build
        run: uv build

  reports:
    name: Generated reports in Chromium and Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked --all-extras
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - name: Download and reopen standalone vectors offline
        run: |
          uv run python studies/vector-charts/capture.py "$RUNNER_TEMP/vector-capture"
          node studies/vector-charts/browser.mjs "$RUNNER_TEMP/vector-capture" "$RUNNER_TEMP/vector-browser"
      - name: Render vectors with the independent SVG 1.1 converter
        run: |
          uv venv "$RUNNER_TEMP/svg-renderer"
          uv pip install --python "$RUNNER_TEMP/svg-renderer/bin/python" -r studies/vector-charts/requirements-cairo.txt
          "$RUNNER_TEMP/svg-renderer/bin/python" studies/vector-charts/cairo.py "$RUNNER_TEMP/vector-browser" "$RUNNER_TEMP/vector-cairo"

  minimums:
    name: Oldest supported Python and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"

      # `requires-python` and every ">=" in pyproject.toml are promises. The lockfile tests
      # the newest versions; this installs the oldest ones the package says it accepts.
      - name: Install the oldest allowed version of each direct dependency
        run: |
          uv venv .venv-minimums
          uv pip install --python .venv-minimums --resolution lowest-direct -e ".[dev,mlflow-files]"

      - name: Test
        run: .venv-minimums/bin/pytest -q
